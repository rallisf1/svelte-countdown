name: Deploy demo to GitHub Pages

on:
    push:
        branches: [master]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Configure Pages
              id: pages
              uses: actions/configure-pages@v5

            - name: Install dependencies
              run: npm ci

            - name: Set countdown target
              shell: bash
              run: |
                  target_date="$(node --input-type=module --eval "import { DateTime } from 'luxon'; console.log(DateTime.now().setZone('Europe/Athens').plus({ months: 8 }).toFormat('yyyy-MM-dd HH:mm:ss'))")"
                  echo "VITE_TARGET_DATE=$target_date" >> "$GITHUB_ENV"

            - name: Build demo
              run: npm run demo:build -- --base "${{ steps.pages.outputs.base_path }}/"

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: demo/dist

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
